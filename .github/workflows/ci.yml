name: Verificación Windows
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Revisar archivos públicos
        run: ./scripts/check-publication.ps1
      - name: Verificar el control de publicación con datos ficticios
        run: ./tests/CheckPublication.Tests.ps1
      - name: Restauración bloqueada
        run: ./restore.ps1
      - name: Compilar con analizadores y errores de advertencia
        run: dotnet build tests/ClickMoves.Tests/ClickMoves.Tests.csproj -c Release --no-restore -warnaserror
      - name: Verificar analizadores sin editar archivos
        run: dotnet format analyzers tests/ClickMoves.Tests/ClickMoves.Tests.csproj --verify-no-changes --no-restore --severity warn
      - name: Pruebas sin interacción de escritorio
        run: ./test.ps1 -CoreOnly
      - name: Generar ejecutable autónomo y comprobar tamaño
        run: ./build.ps1
